<!DOCTYPE html>
<html>
	<head>

		<title>Fancify My Text</title>

		<script src="fancifymytext.js"></script>

	</head>
	<body>

		<fieldset>

			<legend>Text</legend>

			<textarea id="text" rows="4" cols="30"style="font-size: 12pt; font-family: Arial;"></textarea>

		</fieldset>
		<fieldset>

			<legend>Fancify</legend>
			<button onclick="makeBigger()">Bigger!</button><br><br>
			
			<input type="radio" id="fancy" name="style" onchange="changeStyle()" />
			<label for="fancy">FancyShmancy</label><br>
			
			<input type="radio" id="boring" name="style" onchange="changeStyle()" />
			<label for="boring">BoringBetty</label><br><br>

			<button onclick="mooify()">Moo</button>

		</fieldset>
	</body>
</html>
